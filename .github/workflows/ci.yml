name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lrn
          POSTGRES_PASSWORD: lrn
          POSTGRES_DB: lrn_hukuk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lrn -d lrn_hukuk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://lrn:lrn@localhost:5432/lrn_hukuk
      DATABASE_URL_TEST: postgresql://lrn:lrn@localhost:5432/lrn_hukuk
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret-12345
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
